[package]
name = "hive-retina-python"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.83"
publish = false

[lib]
name = "_hive_retina_boundary"
crate-type = ["cdylib"]

[dependencies]
hive-retina-runtime = { path = "../hive-retina-runtime" }
pyo3 = { version = "=0.29.0", features = ["abi3-py312", "extension-module", "generate-import-lib"] }
