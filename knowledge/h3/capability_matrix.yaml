candidate_rules:
  - candidate_id: "reuse-matching-local-comfy-profile"
    state: observed
    promotion_required: true
    rule: "Reuse this exact profile only when workflow revision, GPU/VRAM class, runtime version, model logical ID, and execution mode all match."
  - candidate_id: "isolate-parallel-comfyui-database"
    state: observed
    promotion_required: true
    rule: "A future one-click launcher should avoid sharing the default ComfyUI database between simultaneous local instances."
  - candidate_id: "sageattention-kj-auto-fast-mode"
    state: rejected
    promotion_required: true
    rule: "Enable SageAttention KJ auto as an optional product Fast mode."
    reason: "The one paired run reached only 1.207x submit speedup, below the fixed 1.3x candidate threshold."
  - candidate_id: "c2-alternate-callback-signal"
    state: superseded
    promotion_required: true
    rule: "Define a new separately approved fixed-size view for the actual non-tensor callback object."
    reason: "C2-S0 and C2-R2 established and admitted the exact x0.tensors[0] float32 video path; alternate-signal exploration is no longer the active rule."
  - candidate_id: "c3-transformer-block-wrapper"
    state: rejected
    promotion_required: true
    rule: "Design a backend-owned transformer-block wrapper with Full Compute fallback using only the admitted fixed-size Rust metadata boundary."
    reason: "The source hook is structurally admitted, but immutable C2-R2 replay reaches only 14.8 percent theoretical reduction after fixed anchors and cooldown, below the predeclared 18 percent C3 floor."

